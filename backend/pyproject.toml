[project]
name = "cspm-graph-demo-api"
version = "0.1.0"
description = "Local CSPM Trust Graph demo API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "netraom-graph-writer @ file:../vendor/netraom-graph-writer",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "neo4j>=5.20,<6",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "httpx>=0.27,<1",
]
cloud = [
  "boto3>=1.35,<2",
  "google-cloud-compute>=1.19,<2",
  "google-cloud-storage>=2.18,<4",
  "google-cloud-iam>=2.18,<3",
  "google-cloud-resource-manager>=1.12,<2",
  "google-auth>=2.29,<3",
]
neo4j = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
