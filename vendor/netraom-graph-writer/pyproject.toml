[project]
name = "netraom-graph-writer"
version = "0.1.0"
description = "Vendored combo engine + NetworkX graph (demo subset)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "netraom-contracts @ file:../vendor/netraom-contracts",
  "pydantic>=2.7,<3",
  "networkx>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netraom_graph_writer"]

[tool.hatch.metadata]
allow-direct-references = true
