[project]
name = "netraom-contracts"
version = "0.1.0"
description = "Vendored trust-graph + finding models (demo subset)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netraom_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "netraom_contracts/schemas"
