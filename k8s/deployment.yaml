apiVersion: v1
kind: Namespace
metadata:
  name: netraom-cspm

---
# PostgreSQL Stateful Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cspm-postgres
  namespace: netraom-cspm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cspm-postgres
  template:
    metadata:
      labels:
        app: cspm-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "demo"
            - name: POSTGRES_PASSWORD
              value: "demo"
            - name: POSTGRES_DB
              value: "cspm_demo"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: netraom-cspm
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: cspm-postgres

---
# Neo4j Graph Database Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cspm-neo4j
  namespace: netraom-cspm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cspm-neo4j
  template:
    metadata:
      labels:
        app: cspm-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          env:
            - name: NEO4J_AUTH
              value: "neo4j/changeme"
          ports:
            - containerPort: 7474
            - containerPort: 7687
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: netraom-cspm
spec:
  ports:
    - port: 7474
      name: http
    - port: 7687
      name: bolt
  selector:
    app: cspm-neo4j

---
# FastAPI Backend Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cspm-api
  namespace: netraom-cspm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cspm-api
  template:
    metadata:
      labels:
        app: cspm-api
    spec:
      containers:
        - name: api
          image: netraom-cspm-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://demo:demo@postgres:5432/cspm_demo"
            - name: NEO4J_URI
              value: "bolt://neo4j:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: "changeme"
            - name: DEMO_TENANT_ID
              value: "11111111-1111-4111-8111-111111111111"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: netraom-cspm
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: cspm-api

---
# React UI Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cspm-ui
  namespace: netraom-cspm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cspm-ui
  template:
    metadata:
      labels:
        app: cspm-ui
    spec:
      containers:
        - name: ui
          image: netraom-cspm-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: netraom-cspm
spec:
  ports:
    - port: 5173
      targetPort: 5173
  selector:
    app: cspm-ui
